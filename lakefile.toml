name = "RandomDo"
defaultTargets = ["RandomDo"]
lintDriver = "batteries/runLinter"
testDriver = "Test"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "LeanMachineLearning"
git = "https://github.com/LeanMachineLearning/LML"
rev = "main"

[[lean_lib]]
name = "FFI"
precompileModules = true

[[lean_lib]]
name = "RandomDo"

[[lean_lib]]
name = "Test"

# Used to run the tests in `scripts`
[[lean_exe]]
name = "dump"
root = "Dump"
srcDir = "test_data"
