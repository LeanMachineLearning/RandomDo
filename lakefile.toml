name = "RandomDo"
defaultTargets = ["RandomDo"]
lintDriver = "batteries/runLinter"
testDriver = "Test"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "LeanMachineLearning"
git = "https://github.com/LeanMachineLearning/LML"
rev = "main"

[[lean_lib]]
name = "FFI"
precompileModules = true

[[lean_lib]]
name = "RandomDo"

[[lean_lib]]
name = "Test"

[[lean_lib]]
name = "MetropolisHastings"

[[lean_lib]]
name = "Bandits"

# Used to run the tests in `scripts`
[[lean_exe]]
name = "dump"
root = "Dump"
srcDir = "test_data"

[[lean_exe]]
name = "compute"
root = "Compute"

[[lean_exe]]
name = "polymorphic"
root = "Polymorphic"

[[lean_exe]]
name = "mh"
root = "MetropolisHastings.Main"

[[lean_exe]]
name = "bandits"
root = "Bandits.Main"
